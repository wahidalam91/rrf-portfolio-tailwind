<!doctype html>
<html>

<body class="font-montserrat">
  <div class="hero flex flex-col gap-8 w-[1440px] h-[645px] px-[124px] pt-10 bg-[#FFD4D0]">
    <!-- circle -->
    <div class="circle absolute w-[146px] h-[146px] bg-[#fc3314] rounded-full left-[438px] -top-[57px] z-0">

    </div>

    <!-- header  -->
    <header class="header z-10 flex justify-between items-center">

      <!-- logo -->
      <div class="logo w-[136px] h-9 mb-2">
        <img src="assets/images/Logo.png" alt="">
      </div>

      <!-- Menu-->
      <nav class="header-menu w-[360px]">
        <ul class="flex gap-8 my-3 items-center leading-[130%] ">
          <li><a class="font-bold text-[18px] text-[#1f1f1f] leading-[150%]" href="#">About</a></li>
          <li><a class="font-bold text-[18px] text-[#1f1f1f] leading-[150%]" href="#">Services</a></li>
          <li><a class="font-bold text-[18px] text-[#1f1f1f] leading-[150%]" href="#">Portfolio</a></li>
          <li><a class="font-bold text-[18px] text-[#1f1f1f] leading-[150%]" href="#">Blog</a></li>
        </ul>
      </nav>

      <!-- Header Button -->
      <div
        class="header-btn bg-black w-[127px] h-12 px-6 py-3 text-white font-bold flex items-center justify-center leading-[150%]">
        <a href="#">Let's Talk</a>
      </div>

      <!-- Hero Area -->
      
    </header>
    <div class="hero-area flex gap-12">
        <!-- Hero Text -->
        <div class="hero-text w-[457px] h-[518px] pt-16 pb-20 flex flex-col">

          <div class="text-wrapper flex flex-col gap-4">
            <h3 class="text-[#1f1f1f] text-[20px] leading-[150%] font-montserrat"><span>UX Designer</span></h3>
            <h2 class="font-montserrat font-bold text-[48px] text-[#1f1f1f] leading-[150%]">Hi There, I’m <br> <span class="text-[#FC3314]">John Smith</span></h2>
            <p class="text-[#1F1F1F] leading-[150%] text-base pb-12">Welcome to my portfolio of captivating digital experiences. Explore my work and let's create something extraordinary together.</p>

          </div>
          <!-- Hero Buttons -->
          <div class="hero-buttons w-[457px] h-12 flex gap-5">
            <a class="bg-[#1f1f1f] text-white w-[177px] h-12 px-14 py-3 font-bold leading-[150%] flex justify-center items-center" href="#">Hire Me</a>
            <a class="bg-transparent text-[#1f1f1f] border border-[#1f1f1f] w-[177px] h-12 px-14 py-3 font-bold leading-[150%] flex justify-center items-center" href="#">Portfolio</a>

          </div>
        </div>

        <!-- Hero Images -->
        <div class="hero-image mt-[60px] relative">
          <img class="" src="assets/images/Image.png" alt="">
          <img class="absolute left-[115px] -top-6" src="assets/images/man.png" alt="">

        </div>
      </div>
